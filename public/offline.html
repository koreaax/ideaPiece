<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오프라인 - Fairytale IdeaPiece</title>
<style>
  :root {
    --bg-main: #fef9e7;
    --mint: #d4f0df;
    --mint-deep: #2f855a;
    --peach: #ffd7b5;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 14% 18%, rgba(212, 240, 223, 0.66), transparent 36%),
      radial-gradient(circle at 82% 20%, rgba(255, 215, 181, 0.6), transparent 34%),
      linear-gradient(160deg, #fef9e7 0%, #edf8f0 48%, #fff4e8 100%);
    font-family: 'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    text-align: center;
    padding: 24px;
    color: #334155;
  }

  main {
    max-width: 420px;
    width: 100%;
    background: rgba(255, 255, 255, 0.9);
    border: 4px solid rgba(255, 255, 255, 0.7);
    border-radius: 2rem;
    padding: 40px 28px;
    box-shadow: 0 20px 40px rgba(47, 133, 89, 0.12);
  }

  .emoji {
    font-size: 3.2rem;
    line-height: 1;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 900;
    color: #1e293b;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #475569;
    margin: 0 0 24px;
  }

  button {
    appearance: none;
    border: none;
    cursor: pointer;
    border-radius: 9999px;
    background: var(--mint-deep);
    color: #ffffff;
    font-family: inherit;
    font-weight: 800;
    font-size: 1rem;
    padding: 14px 32px;
    box-shadow: 0 10px 20px rgba(47, 133, 89, 0.35);
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  button:active {
    transform: scale(0.95);
    box-shadow: 0 6px 14px rgba(47, 133, 89, 0.3);
  }
</style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">🌙</div>
    <h1>앗, 잠깐 인터넷이 안 보여요!</h1>
    <p>동화 나라로 가는 길이 잠시 끊겼나 봐요.<br />인터넷 연결을 확인하고 다시 눌러 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도하기</button>
  </main>
</body>
</html>
